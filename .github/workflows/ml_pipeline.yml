name: ML Pipeline — FIAP Fintech Churn

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Lint (flake8)
        run: flake8 src/ --max-line-length=100 --ignore=E501,W503
      - name: Testes unitários
        run: pytest tests/ -v

  training-and-evaluation:
    needs: quality-assurance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Baixar dataset
        run: |
          mkdir -p data/raw
          curl -L "https://github.com/lfbraz/introducao-ciclo-de-vida-de-modelos/raw/main/data/dados_clientes.csv" \
            -o data/raw/dados_clientes.csv
      - name: Treinar modelo
        run: python src/train.py
      - name: Verificar métricas mínimas
        run: |
          python3 - <<'PYEOF'
          import json, sys
          with open("metrics.json") as f:
              m = json.load(f)
          print(f"Accuracy: {m['accuracy']} | Recall: {m['recall']} | F1: {m['f1_score']}")
          if m["accuracy"] < 0.80:
              print("BLOQUEADO: accuracy abaixo de 80%")
              sys.exit(1)
          if m["recall"] < 0.75:
              print("BLOQUEADO: recall abaixo de 75%")
              sys.exit(1)
          print("Métricas aprovadas.")
          PYEOF
      - name: Auditoria de fairness e governança
        run: python src/governance.py
      - name: Salvar artefatos do treino
        uses: actions/upload-artifact@v4
        with:
          name: ml-artifacts
          path: |
            mlruns/
            metrics.json
            model_card.json

  docker-build:
    needs: training-and-evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar artefatos do treino
        uses: actions/download-artifact@v4
        with:
          name: ml-artifacts
      - name: Build da imagem Docker
        run: docker build -t fiap-churn-api:ci .
      - name: Subir container para teste
        run: |
          docker run -d --name churn-api -p 8000:8000 fiap-churn-api:ci
          sleep 5
      - name: Teste de integração — /health
        run: |
          STATUS=$(curl -s http://localhost:8000/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status'])")
          echo "Status: $STATUS"
          if [ "$STATUS" != "ok" ]; then
            echo "FALHOU: API não carregou o modelo"
            exit 1
          fi
      - name: Teste de integração — /predict
        run: |
          RESULT=$(curl -s -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"Idade":63,"RendaMensal":3200.0,"PercentualUtilizacaoLimite":85.0,"QtdTransacoesNegadas":8,"AnosDeRelacionamentoBanco":2,"JaUsouChequeEspecial":1,"QtdEmprestimos":0,"NumeroAtendimentos":15,"TMA":87,"IndiceSatisfacao":2,"Saldo":9936.0,"CLTV":66,"CanalPref":"Email"}')
          echo "Resultado: $RESULT"
          CHURN=$(echo $RESULT | python3 -c "import sys,json; print(json.load(sys.stdin)['churn'])")
          if [ "$CHURN" != "1" ]; then
            echo "FALHOU: predict retornou churn=$CHURN, esperado 1"
            exit 1
          fi
          echo "Predict aprovado."
      - name: Parar container
        if: always()
        run: docker stop churn-api && docker rm churn-api
