name: ML Pipeline FIAP Fintech Churn

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Lint flake8
        run: flake8 src/ --max-line-length=100 --ignore=E501,W503
      - name: Testes unitarios
        run: pytest tests/ -v

  training-and-evaluation:
    needs: quality-assurance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Baixar dataset
        run: |
          mkdir -p data/raw
          curl -L "https://github.com/lfbraz/introducao-ciclo-de-vida-de-modelos/raw/main/data/dados_clientes.csv" -o data/raw/dados_clientes.csv
      - name: Treinar modelo
        run: python src/train.py
      - name: Verificar metricas minimas
        run: python3 -c "import json,sys; m=json.load(open('metrics.json')); sys.exit(1) if m['accuracy']<0.80 or m['recall']<0.75 else print('Metricas OK:', m)"
      - name: Auditoria de fairness
        run: python src/governance.py
      - name: Salvar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: ml-artifacts
          path: |
            mlruns/
            metrics.json
            model_card.json

  docker-build:
    needs: training-and-evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          name: ml-artifacts
      - name: Build Docker
        run: docker build -t fiap-churn-api:ci .
      - name: Subir container
        run: |
          docker run -d --name churn-api -p 8000:8000 fiap-churn-api:ci
          sleep 8
      - name: Teste health
        run: |
          STATUS=$(curl -s http://localhost:8000/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          test "$STATUS" = "ok" && echo "Health OK" || (echo "FALHOU: $STATUS" && exit 1)
      - name: Teste predict
        run: |
          CHURN=$(curl -s -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"Idade":63,"RendaMensal":3200.0,"PercentualUtilizacaoLimite":85.0,"QtdTransacoesNegadas":8,"AnosDeRelacionamentoBanco":2,"JaUsouChequeEspecial":1,"QtdEmprestimos":0,"NumeroAtendimentos":15,"TMA":87,"IndiceSatisfacao":2,"Saldo":9936.0,"CLTV":66,"CanalPref":"Email"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['churn'])")
          test "$CHURN" = "1" && echo "Predict OK" || (echo "FALHOU churn=$CHURN" && exit 1)
      - name: Parar container
        if: always()
        run: docker stop churn-api && docker rm churn-api
